version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "04:15"
    open-pull-requests-limit: 10
    # Published dependencies use ranges, so only releases outside a range need a PR.
    versioning-strategy: increase-if-necessary
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"

      babel:
        patterns:
          - "@babel/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "04:15"
    open-pull-requests-limit: 10
